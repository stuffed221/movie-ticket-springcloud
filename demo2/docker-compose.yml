      - "8083:8083"
    environment:
      - spring.cloud.nacos.server-addr=host.docker.internal:8848
      - NACOS_ADDR=host.docker.internal:8848
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/tw_db
      - DB_URL=jdbc:mysql://host.docker.internal:3306/tw_db
      - spring.datasource.username=root
      - spring.datasource.password=wzh2213254020
      - spring.redis.host=host.docker.internal
