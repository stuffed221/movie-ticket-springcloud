services:
  gateway:
    image: demo2-gateway:latest
    container_name: movie-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.cloud.nacos.server-addr=host.docker.internal:8848
      - NACOS_ADDR=host.docker.internal:8848

  movie-service:
